<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Beat Tap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Startbildschirm -->
  <section id="start" class="screen active">
    <div class="panel">
      <div class="logo">BDAY<span>BEAT</span></div>
      <p class="for">Ein Spiel für <b id="recipient"></b></p>
      <div class="demo" aria-hidden="true">
        <div class="demo-cell"><div class="marker"><div class="half top"></div><div class="half bot"></div></div></div>
      </div>
      <p class="howto">
      Vielleicht hast du ja Glück, <br> und es wartet  <b>ein Geschenk</b> auf dich.
      </p>
      <p class="goal">Ziel: mindestens <b id="goal-score"></b> Punkte</p>
      <div class="diff" id="diff">
        <button data-diff="easy">Leicht</button>
        <button data-diff="normal">Normal</button>
        <button data-diff="hard">Schwer</button>
      </div>
      <button id="btn-start" class="btn primary">Los geht's ▶</button>
    </div>
  </section>

  <!-- Liedauswahl -->
  <section id="songs" class="screen">
    <div class="panel">
      <h2 class="songs-head">Wähle ein Lied</h2>
      <p class="hint" id="songs-diff"></p>
      <div class="song-list" id="song-list"></div>
      <p class="hint" id="song-info" hidden></p>
      <p class="hint error" id="song-error" hidden></p>
      <button id="btn-songs-back" class="btn ghost">← Zurück</button>
    </div>
  </section>

  <!-- Spiel -->
  <section id="game" class="screen">
    <div class="hud">
      <div>
        <small>SCORE</small>
        <div id="score">0</div>
      </div>
      <div class="combo">
        <small>COMBO</small>
        <div id="combo">0</div>
      </div>
    </div>
    <div class="progress"><div id="progress-bar"></div></div>
    <div id="grid"></div>
    <div id="countdown"></div>
    <div id="pause" class="overlay" hidden>
      <div>Pausiert<br><small>Tippen zum Weiterspielen</small></div>
    </div>
  </section>

  <!-- Ergebnis -->
  <section id="result" class="screen">
    <div class="panel">
      <h2 id="res-title"></h2>
      <div class="big-score" id="res-score"></div>
      <p id="res-msg"></p>
      <div class="stats">
        <div><span class="perfect">PERFECT</span><b id="r-perfect"></b></div>
        <div><span class="great">GREAT</span><b id="r-great"></b></div>
        <div><span class="good">GOOD</span><b id="r-good"></b></div>
        <div><span class="miss">MISS</span><b id="r-miss"></b></div>
        <div><span>MAX COMBO</span><b id="r-combo"></b></div>
      </div>
      <button id="btn-reward" class="btn primary">Zur Überraschung 🎁</button>
      <button id="btn-retry" class="btn primary">Nochmal versuchen</button>
      <button id="btn-easier" class="btn">Etwas leichter probieren</button>
      <button id="btn-other-song" class="btn">Anderes Lied</button>
      <button id="btn-menu" class="btn ghost">Zum Menü</button>
    </div>
  </section>

  <!-- Gewonnen: Gutschein -->
  <section id="win" class="screen">
    <div class="panel">
      <h1 id="win-title"></h1>
      <p id="win-text"></p>
      <div class="card-scene" id="card-scene">
        <div class="card-tilt">
          <div class="card-float">
            <div class="card-flip" id="card-flip">
              <!-- Vorderseite: Logo -->
              <div class="card-face card-front">
                <img id="v-logo" alt="">
                <div class="card-fallback" id="v-front-title"></div>
                <span class="card-tag" id="v-heading"></span>
              </div>
              <!-- Rückseite: Details -->
              <div class="card-face card-back">
                <div class="card-back-head" id="v-heading-back"></div>
                <div class="card-for">für <b id="v-recipient"></b></div>
                <div class="card-title" id="v-title"></div>
                <div class="card-details" id="v-details"></div>
                <div class="card-foot">
                  <span>von <b id="v-from"></b></span>
                  <span id="v-code"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-shadow"></div>
      </div>
      <p class="hint">👆 Tippe auf die Karte, um sie umzudrehen</p>
      <button id="btn-again" class="btn ghost">Nochmal spielen</button>
    </div>
  </section>

  <canvas id="confetti"></canvas>

  <!-- dezenter Vollbild-Schalter -->
  <button id="btn-fs" class="fs-btn" aria-label="Vollbild" title="Vollbild" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>

  <script src="config.js"></script>
  <script src="game.js"></script>
</body>
</html>
